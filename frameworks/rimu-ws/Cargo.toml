[package]
name = "httparena-rimu-ws"
version = "0.1.0"
edition = "2024"

[dependencies]
rimu-ws = { default-features = false, features = ["crypto-ring", "io-uring", "optimizations-std", "web-socket-server-framework"], git = "https://github.com/vincentmele/rimu-ws", rev = "948d3ce260a4198e1754dd8f263f3b28ca043b76" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
