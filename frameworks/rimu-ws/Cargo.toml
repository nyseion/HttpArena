[package]
name = "httparena-rimu-ws"
version = "0.1.0"
edition = "2024"

[dependencies]
rimu-ws = { default-features = false, features = ["crypto-ring", "io-uring", "optimizations-std", "web-socket-server-framework"], git = "https://github.com/vincentmele/rimu-ws", rev = "85cd234ec5c0e19d9c3e2dc3be788bda65fea02a" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
