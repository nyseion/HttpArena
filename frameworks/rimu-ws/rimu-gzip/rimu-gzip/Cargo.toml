[package]
name = "rimu-gzip"
description = "A one-shot DEFLATE, zlib and gzip encoder: fast on small bodies, libdeflate-class sizes on large ones, allocation-free once warm, no_std + alloc."
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
crc32fast = { version = "1.4", default-features = false }

[dependencies.miniz_oxide]
version = "0.8"
optional = true

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libdeflater = "1"
miniz_oxide = "0.8"

[features]
default = ["std"]
std = ["crc32fast/std"]
# The round-trip checker of the fuzz target (`check::check_bytes`); not part of the API.
_fuzz = ["std", "dep:miniz_oxide"]
