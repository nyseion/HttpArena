[package]
name = "rimu-quic"
description = "A sans-I/O QUIC v1 server transport (RFC 9000, 9001, 9002) with a multi-worker endpoint, TLS through rustls."
keywords = ["quic", "http3", "sans-io", "rustls", "networking"]
categories = ["network-programming", "no-std"]
readme = "../README.md"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
default = ["rustls", "ring"]
## The standard library: AES-NI detection for batched header protection, seeding from the OS.
std = ["getrandom", "foldhash/std"]
## TLS 1.3 through rustls's QUIC API (implies `std`).
rustls = ["dep:rustls", "std"]
## The ring crypto backend (packet protection keys; rustls's provider with `rustls`).
ring = ["dep:ring", "rustls?/ring"]
## The aws-lc-rs crypto backend.
aws-lc-rs = ["dep:aws-lc-rs", "rustls?/aws_lc_rs"]
## The I/O driver on rimu-uring (Linux 6.1 or later): a multi-worker server loop (`uring`).
uring = ["std", "dep:rimu-uring"]
## The test client (rustls's client): for tests and interop only, not a supported client.
client = ["rustls"]
## Records the counters of `diag` (pool exhaustion, records in flight): a few atomics per packet.
diag = []
## Exposes micro-benchmarks of crate-private code to `bench/`.
__bench = ["client"]
## Exposes the model checks and decoders' check functions to the fuzz targets.
__fuzz = ["client"]

[dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
foldhash = { version = "0.2", default-features = false }
getrandom = { version = "0.3", optional = true }
hashbrown = { version = "0.16", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
ring = { version = "0.17.14", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false }
# rimu-uring at e5254a3 (14 Nov 2026)
rimu-uring = { path = "../../rimu-uring", default-features = false, features = ["udp"], optional = true }

[package.metadata.docs.rs]
all-features = false
features = ["rustls", "ring"]

[[test]]
name = "uring"
required-features = ["uring", "client"]

[[test]]
name = "uring_alloc"
required-features = ["uring", "client"]
